<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Modogo - Admin Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; color: #1a56db; margin-bottom: 5px; font-size: 22px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e5e7eb; border-radius: 8px; font-weight: bold; cursor: pointer; color: #374151; }
        .tab-btn.active { background: #1a56db; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 20px; font-weight: bold; color: #0f172a; }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; margin-top: 4px; }
        textarea, input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        button.action-btn { width: 100%; padding: 12px; background: #1a56db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background: #1e40af; }
        .vendor-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .vendor-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
        .vendor-row { display: flex; gap: 10px; align-items: center; }
        .vendor-row input { margin-bottom: 0; }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-available { background: #dcfce7; color: #166534; }
        .badge-assigned { background: #fef3c7; color: #92400e; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f1f5f9; }
        .cloud-status { text-align: center; font-size: 11px; margin-top: 15px; color: #16a34a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Super Modogo - Admin Central</h1>
        <div class="cloud-status" id="cloudStatus">⚡ Connexion Cloud Supabase active</div>
        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 15px 0;">

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('gallery')">🗄️ Galerie à Codes</button>
            <button class="tab-btn" onclick="switchTab('vendors')">👥 Table des Vendeurs</button>
        </div>

        <!-- ONGLET GALERIE -->
        <div id="tab-gallery" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalCodes">0</div>
                    <div class="stat-label">Total Codes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="availCodes" style="color: #16a34a;">0</div>
                    <div class="stat-label">Disponibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="assignedCodes" style="color: #d97706;">0</div>
                    <div class="stat-label">Assignés</div>
                </div>
            </div>

            <label><b>Injecter un nouveau lot de codes :</b></label>
            <textarea id="codeImport" rows="3" placeholder="MODOGO-1001&#10;MODOGO-1002"></textarea>
            <button class="action-btn" onclick="addCodes()">Ajouter à la Galerie</button>

            <h4 style="margin-top: 20px; margin-bottom: 5px;">Rechercher un code :</h4>
            <input type="text" id="searchInput" oninput="renderGallery()" placeholder="Tapez un code...">
            
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Statut</th>
                        <th>Assigné à</th>
                    </tr>
                </thead>
                <tbody id="galleryBody"></tbody>
            </table>
        </div>

        <!-- ONGLET VENDEURS -->
        <div id="tab-vendors" class="tab-content">
            <label><b>Ajouter un nouveau vendeur :</b></label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="newVendorName" placeholder="Nom du vendeur (ex: Jean Gare Central)" style="margin-bottom:0;">
                <button class="action-btn" onclick="addVendor()" style="width: 80px;">Ajouter</button>
            </div>

            <h4 style="margin-top: 20px; margin-bottom: 10px;">Gestion & Recharge à Distance :</h4>
            <div id="vendorsList"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://kmlqtwbrgsdjmciwldpv.supabase.co";
        const SUPABASE_KEY = "Sb_secret_c6lYQjYx90_JaJQ-WOYhhA_aZc861jK";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let appData = {
            codes: [], // { code, assignedTo: null | vendorId }
            vendors: [] // { id, name, stock: [] }
        };

        async function init() {
            const { data, error } = await db.from('modogo_stock').select('data').eq('id', 'central_data').single();
            if (data && data.data) {
                appData = data.data;
            }
            renderAll();
        }

        async function saveData() {
            await db.from('modogo_stock').upsert({ id: 'central_data', data: appData, updated_at: new Date() });
            renderAll();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'gallery') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-gallery').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-vendors').classList.add('active');
            }
        }

        function addCodes() {
            const raw = document.getElementById('codeImport').value.trim();
            if (!raw) return;
            const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let added = 0;
            lines.forEach(c => {
                if (!appData.codes.some(item => item.code === c)) {
                    appData.codes.push({ code: c, assignedTo: null });
                    added++;
                }
            });
            document.getElementById('codeImport').value = '';
            saveData();
            alert(`${added} code(s) ajouté(s) avec succès !`);
        }

        function addVendor() {
            const name = document.getElementById('newVendorName').value.trim();
            if (!name) return;
            const newId = 'VENDEUR-' + Math.floor(100 + Math.random() * 900);
            appData.vendors.push({ id: newId, name: name, stock: [] });
            document.getElementById('newVendorName').value = '';
            saveData();
        }

        async function assignStock(vendorId) {
            const qtyInput = document.getElementById(`qty-${vendorId}`);
            const qty = parseInt(qtyInput.value);
            if (!qty || qty <= 0) return alert("Veuillez entrer une quantité valide.");

            const available = appData.codes.filter(c => c.assignedTo === null);
            if (available.length < qty) {
                return alert(`Stock insuffisant dans la Galerie ! (${available.length} disponible(s))`);
            }

            const vendor = appData.vendors.find(v => v.id === vendorId);
            const toAssign = available.slice(0, qty);

            toAssign.forEach(c => {
                c.assignedTo = vendorId;
                vendor.stock.push(c.code);
            });

            // Sauvegarder central + pousser directement dans le canal du vendeur
            await saveData();
            await db.from('modogo_stock').upsert({ id: vendorId, data: { stock: vendor.stock }, updated_at: new Date() });
            
            alert(`✅ ${qty} code(s) envoyés à distance à ${vendor.name} !`);
        }

        function renderGallery() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = appData.codes.filter(c => c.code.toLowerCase().includes(search));
            
            let html = '';
            filtered.forEach(c => {
                const status = c.assignedTo ? `<span class="badge badge-assigned">Assigné</span>` : `<span class="badge badge-available">Disponible</span>`;
                const vendorName = c.assignedTo ? (appData.vendors.find(v => v.id === c.assignedTo)?.name || c.assignedTo) : '-';
                html += `<tr><td><b>${c.code}</b></td><td>${status}</td><td>${vendorName}</td></tr>`;
            });
            document.getElementById('galleryBody').innerHTML = html;

            document.getElementById('totalCodes').innerText = appData.codes.length;
            document.getElementById('availCodes').innerText = appData.codes.filter(c => !c.assignedTo).length;
            document.getElementById('assignedCodes').innerText = appData.codes.filter(c => c.assignedTo).length;
        }

        function renderVendors() {
            let html = '';
            appData.vendors.forEach(v => {
                html += `
                    <div class="vendor-card">
                        <div class="vendor-header">
                            <span>👤 ${v.name}</span>
                            <small style="color:#64748b;">ID: ${v.id}</small>
                        </div>
                        <div style="font-size: 13px; margin-bottom: 8px;">Stock en main : <b>${v.stock.length} code(s)</b></div>
                        <div class="vendor-row">
                            <input type="number" id="qty-${v.id}" placeholder="Qté" style="width: 80px;" min="1">
                            <button class="action-btn" onclick="assignStock('${v.id}')">⚡ Recharger à distance</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('vendorsList').innerHTML = html || '<p style="color:#64748b; text-align:center;">Aucun vendeur enregistré.</p>';
        }

        function renderAll() {
            renderGallery();
            renderVendors();
        }

        init();
    </script>
</body>
</html>
